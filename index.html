<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>AGUS · Sandbox Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ----- reset & base ----- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }
    :root {
      --bg: #f7f9fc;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #eef2fb;
      --border: #e2e5f0;
      --border-soft: #ecf0f7;
      --text: #1b1f3b;
      --text-muted: #5a6180;
      --text-faint: #9aa0bd;
      --teal: #6d5ae0;
      --teal-dim: #ece9fb;
      --amber: #f0a63c;
      --red: #ef4d6a;
      --blue: #3aa1e0;
      --green: #23c08b;
      --purple: #9a6bff;
      --orange: #ff8c42;
      --radius: 12px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      --display: 'Space Grotesk', sans-serif;
      --shadow: 0 1px 3px rgba(59,51,150,0.06);
      --shadow-lg: 0 8px 24px rgba(59,51,150,0.12);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #0a0a12;
      --bg-panel: #101019;
      --bg-card: #13131f;
      --bg-card-hover: #1a1a2c;
      --border: #2a2a45;
      --border-soft: #1d1d31;
      --text: #eeedfb;
      --text-muted: #9b99c0;
      --text-faint: #62608a;
      --teal: #8b7cf8;
      --amber: #f5b85c;
      --red: #ff5d7a;
      --blue: #55b7f0;
      --green: #34d9a1;
      --purple: #b58dff;
      --orange: #ffa364;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
    /* ----- layout: always fill viewport, shrink to fit ----- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      padding: 10px 12px;
      width: 100%;
      max-width: 100%;
    }
    .layout-grid {
      display: flex;
      gap: 12px;
      height: 100%;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      align-items: stretch;
    }
    .sidebar {
      flex: 0 1 28%;
      min-width: 160px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 10px;
      box-shadow: var(--shadow);
    }
    .content-col {
      flex: 1 1 72%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 10px;
    }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s;
      min-width: 0;
      overflow: hidden;
    }
    .metric-card {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .chart-with-well {
      display: flex;
      gap: 8px;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .chart-wrap {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .chart-wrap canvas {
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
    }
    .well-fig {
      flex: 0 1 100px;
      min-width: 60px;
      max-width: 180px;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-panel);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .well-fig svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .station-list {
      flex: 1 1 auto;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      margin-top: 6px;
    }
    .station-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .station-row.active { opacity: 1; border-color: var(--teal); background: var(--bg-card-hover); }
    .station-row i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex-shrink: 0; }
    .station-row .sname { font-size: 11px; font-weight: 600; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-row.active .sname { color: var(--text); }
    .status-badge { font-size: 8px; padding: 1px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .status-badge.online { background: var(--green); color: #fff; }
    .status-badge.warning { background: var(--amber); color: #fff; }
    .status-badge.critical { background: var(--red); color: #fff; }
    .stats-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 4px 0;
    }
    .stat {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      flex: 1 0 auto;
      min-width: 70px;
      max-width: 140px;
    }
    .stat .label { font-size: 7px; text-transform: uppercase; color: var(--text-faint); }
    .stat .value { font-size: 12px; font-weight: 700; color: var(--teal); font-family: var(--mono); }
    .stat .value span { font-size: 8px; color: var(--text-faint); }
    .trend { font-size: 9px; }
    .trend.up { color: var(--green); }
    .trend.down { color: var(--red); }
    .trend.flat { color: var(--text-faint); }
    header.topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #9a6bff, #6d5ae0, #2f9ff0);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: #fff;
    }
    .brand-text b { font-size: 14px; font-family: var(--display); }
    .brand-text span { font-size: 9px; color: var(--text-faint); font-family: var(--mono); }
    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .period-tabs {
      display: flex;
      gap: 3px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
    }
    .period-tabs button {
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .period-tabs button.active { background: var(--teal); color: #fff; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      min-width: 120px;
    }
    .search-box input {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      outline: none;
      width: 100%;
      min-width: 40px;
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text-muted);
      font-size: 15px;
    }
    .kbd-hint { font-size: 9px; color: var(--text-faint); font-family: var(--mono); padding: 2px 6px; border: 1px solid var(--border); border-radius: 5px; }
    .metric-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .metric-tab {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .metric-tab.active { border-color: var(--teal); background: var(--teal); color: #fff; }
    .metric-tab .unit { font-weight: 400; opacity: 0.7; margin-left: 2px; }
    .view-toggle {
      display: flex;
      gap: 2px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .view-toggle button {
      padding: 3px 8px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .view-toggle button.active { background: var(--teal); color: #fff; }
    .btn-icon {
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
    }
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 100px 1fr 60px;
      gap: 8px;
      align-items: center;
    }
    .rank-row .rbar-wrap {
      background: var(--bg-panel);
      border-radius: 4px;
      height: 16px;
      position: relative;
      overflow: hidden;
    }
    .rank-row .rbar { height: 100%; border-radius: 4px; transition: width 0.2s; }
    .rank-row .rval { font-family: var(--mono); font-size: 11px; text-align: right; }
    #heatmapView table { width: 100%; border-collapse: collapse; font-size: 10px; }
    #heatmapView th, #heatmapView td { padding: 4px 6px; border-bottom: 1px solid var(--border-soft); text-align: center; }
    #heatmapView th { font-family: var(--mono); color: var(--teal); }
    .station-detail-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .station-detail-modal.active { opacity: 1; pointer-events: all; }
    .station-detail-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 460px;
      width: 92%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: translateY(8px);
      transition: transform 0.2s;
    }
    .station-detail-modal.active .station-detail-panel { transform: translateY(0); }
    .close-btn {
      position: absolute; top: 12px; right: 16px;
      background: transparent; border: none;
      font-size: 22px; color: var(--text-muted);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .detail-item {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
    }
    .detail-item .label { font-size: 8px; text-transform: uppercase; color: var(--text-faint); }
    .detail-item .value { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--teal); }
    .hidden { display: none !important; }
    .mono { font-family: var(--mono); }
    .empty-note { color: var(--text-faint); font-size: 12px; text-align: center; padding: 20px 0; }
    @media (max-width: 820px) {
      .layout-grid { flex-direction: column; height: auto; overflow: visible; }
      .sidebar { max-width: 100%; flex: 0 0 auto; max-height: 240px; }
      .content-col { flex: 1 1 auto; }
      .chart-with-well { flex-direction: column; }
      .well-fig { max-width: 100%; height: 70px; flex: 0 0 70px; }
      #app { height: auto; max-height: none; overflow: visible; }
      main { overflow: visible; height: auto; }
    }
    @media (max-width: 480px) {
      header.topbar { padding: 6px 10px; }
      .brand-text b { font-size: 12px; }
      .search-box { min-width: 80px; }
      .stat { min-width: 50px; padding: 3px 6px; }
      .stat .value { font-size: 10px; }
    }
    #trendChartWrap { position: relative; width: 100%; height: auto; flex: 1 1 auto; min-height: 0; }
    #trendChartWrap canvas { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">SA</div><div class="brand-text"><b>Sandbox Analytics</b><span>AGUS · CWD</span></div></div>
    <div class="topbar-controls">
      <div class="search-box"><input type="text" id="stationSearch" placeholder="Search..."></div>
      <div class="period-tabs" id="periodTabs">
        <button data-period="weekly">Weekly</button>
        <button data-period="monthly" class="active">Monthly</button>
        <button data-period="yearly">Yearly</button>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <button class="theme-toggle" onclick="loadLiveData()">↻</button>
      <span class="kbd-hint" id="gasStatus">live</span>
    </div>
  </header>
  <main>
    <div class="layout-grid">
      <aside class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
          <span style="font-family:var(--mono);font-size:9px;color:var(--teal);font-weight:600;">STATIONS</span>
          <span class="kbd-hint" id="stationCount">0 selected</span>
        </div>
        <div style="display:flex; gap:4px; flex-wrap:wrap; margin:4px 0;">
          <button class="btn-icon" onclick="selectAllStations()">All</button>
          <button class="btn-icon" onclick="deselectAllStations()">None</button>
        </div>
        <div class="station-list" id="stationChips"></div>
      </aside>
      <div class="content-col">
        <div class="panel" style="flex-shrink:0;">
          <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
            <span style="font-family:var(--mono);font-size:9px;color:var(--teal);font-weight:600;">FLEET SUMMARY</span>
            <div class="metric-tabs" id="metricTabs"></div>
          </div>
          <div class="stats-row" id="statsRow"></div>
        </div>
        <div class="panel metric-card">
          <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:4px;">
            <span style="font-family:var(--mono);font-size:9px;color:var(--teal);font-weight:600;">PARAMETER</span>
            <div class="view-toggle" id="viewToggle">
              <button data-view="trend" class="active">📈 Trend</button>
              <button data-view="compare">📊 Compare</button>
              <button data-view="heatmap">🔥 Heatmap</button>
            </div>
            <div style="margin-left:auto; display:flex; gap:4px;">
              <button class="btn-icon" id="exportCsvBtn">CSV</button>
              <button class="btn-icon" id="printBtn">🖨</button>
            </div>
          </div>
          <div class="chart-with-well" id="chartWithWell">
            <div class="chart-wrap" id="trendChartWrap"><canvas id="mainChart"></canvas></div>
            <div class="well-fig" id="wellFig"></div>
          </div>
          <div class="rank-list" id="compareView" style="display:none;"></div>
          <div id="heatmapView" style="display:none;"></div>
        </div>
      </div>
    </div>
  </main>
  <div class="station-detail-modal" id="stationModal"><div class="station-detail-panel" style="position:relative;"><button class="close-btn" onclick="closeStationModal()">×</button><h2 id="modalStationName"></h2><div class="detail-grid" id="modalDetails"></div></div></div>
</div>
<script>
  // ----- NO HARDCODED STATION DATA – everything comes from GAS -----
  let STATIONS = [];
  let PUMP_SETTING = {};
  let WELL_DEPTH = {};
  const METRICS = [{key:'voltage',label:'Voltage',unit:'V',color:'--teal'},{key:'current',label:'Current',unit:'A',color:'--blue'},{key:'power',label:'Power',unit:'kW',color:'--amber'},{key:'discharge',label:'Discharge',unit:'L/s',color:'--red'},{key:'pressure',label:'Pressure',unit:'psi',color:'--green'},{key:'levelStatic',label:'Static WL',unit:'m',color:'--purple'},{key:'levelPumping',label:'Pumping WL',unit:'m',color:'--orange'}];
  const THRESHOLDS = { voltage:{min:180,max:480,criticalMin:170,criticalMax:500}, current:{min:0,max:100,criticalMin:0,criticalMax:120}, power:{min:0,max:100,criticalMin:0,criticalMax:120}, discharge:{min:0,max:100,criticalMin:0,criticalMax:100}, pressure:{min:10,max:200,criticalMin:5,criticalMax:220}, levelStatic:{min:0,max:100,criticalMin:0,criticalMax:100}, levelPumping:{min:0,max:100,criticalMin:0,criticalMax:100} };
  const BUCKET_COUNT = { weekly:12, monthly:12, yearly:6 };
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ----- state -----
  const state = { period:'monthly', metric:'voltage', metrics:new Set(['voltage']), view:'trend', selected:new Set(), sortBy:'name', searchQuery:'' };
  let mainChartInstance = null;
  const dataCache = { weekly:{}, monthly:{}, yearly:{} };

  // ----- helpers -----
  function themeColor(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#6d5ae0'; }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]||m)); }
  function buildLabels(period){ const now=new Date(); const n=BUCKET_COUNT[period]; const labels=[]; for(let i=n-1;i>=0;i--){ if(period==='weekly'){ const d=new Date(now); d.setDate(d.getDate()-i*7); labels.push(MONTH_SHORT[d.getMonth()]+' '+d.getDate()); } else if(period==='monthly'){ const d=new Date(now); d.setDate(1); d.setMonth(d.getMonth()-i); labels.push(MONTH_SHORT[d.getMonth()]+' '+d.getFullYear()); } else { const d=new Date(now); d.setFullYear(d.getFullYear()-i); labels.push(String(d.getFullYear())); } } return labels; }
  function stationColor(s){ const idx=STATIONS.indexOf(s); if(idx<0)return '#6d5ae0'; const hue=Math.round((idx*137.508)%360); const dark=document.documentElement.getAttribute('data-theme')==='dark'; return `hsl(${hue},62%,${dark?68:42}%)`; }

  // ----- render stations (from live data) -----
  function getOverallStatus(s){ if(!dataCache[state.period]?.levelPumping?.[s]) return 'online'; const arr=dataCache[state.period].levelPumping[s]; const latest=arr[arr.length-1]; if(PUMP_SETTING[s] && PUMP_SETTING[s]-latest<5) return 'critical'; let hasWarn=false; for(const m of METRICS){ const v=dataCache[state.period][m.key]?.[s]?.[dataCache[state.period][m.key][s].length-1]; if(v===undefined)continue; const t=THRESHOLDS[m.key]; if(v<t.criticalMin||v>t.criticalMax)return 'critical'; if(v<t.min||v>t.max)hasWarn=true; } return hasWarn?'warning':'online'; }
  function getFilteredStations(){ let f=STATIONS.filter(s=>!state.searchQuery||s.toLowerCase().includes(state.searchQuery.toLowerCase())); if(state.sortBy==='status'){ const order={critical:0,warning:1,online:2}; f.sort((a,b)=>order[getOverallStatus(a)]-order[getOverallStatus(b)]); } else f.sort((a,b)=>a.localeCompare(b)); return f; }
  function renderStationChips(){ const wrap=document.getElementById('stationChips'); const filtered=getFilteredStations(); if(!STATIONS.length){ wrap.innerHTML='<div class="empty-note">No stations loaded. Sync with GAS.</div>'; document.getElementById('stationCount').textContent='0'; return; }
  wrap.innerHTML=filtered.map(s=>{ const active=state.selected.has(s); const dot=stationColor(s); const status=getOverallStatus(s); return `<div class="station-row ${active?'active':''}" style="--dot:${dot};" onclick="toggleStation('${escapeHtml(s)}')" ondblclick="showStationDetail('${escapeHtml(s)}')"><i></i><span class="sname">${escapeHtml(s)}</span><span class="status-badge ${status}">${status}</span></div>`; }).join(''); document.getElementById('stationCount').textContent=`${state.selected.size} of ${STATIONS.length}`; }
  function toggleStation(n){ if(state.selected.has(n)) state.selected.delete(n); else state.selected.add(n); renderAll(); }
  function selectAllStations(){ getFilteredStations().forEach(s=>state.selected.add(s)); renderAll(); }
  function deselectAllStations(){ state.selected.clear(); renderAll(); }
  document.getElementById('stationSearch').addEventListener('input',e=>{ state.searchQuery=e.target.value; renderStationChips(); });

  // ----- modal -----
  function showStationDetail(s){ if(!STATIONS.length)return; const modal=document.getElementById('stationModal'); document.getElementById('modalStationName').textContent=s; const details=document.getElementById('modalDetails'); let html=''; for(const m of METRICS){ const val=dataCache[state.period]?.[m.key]?.[s]?.[dataCache[state.period][m.key][s].length-1]; html+=`<div class="detail-item"><div class="label">${m.label} (${m.unit})</div><div class="value">${val!==undefined?val.toFixed(1):'—'}</div></div>`; } details.innerHTML=html; modal.classList.add('active'); }
  function closeStationModal(){ document.getElementById('stationModal').classList.remove('active'); }
  document.getElementById('stationModal').addEventListener('click',e=>{ if(e.target.id==='stationModal') closeStationModal(); });

  // ----- stats -----
  function renderStats(){ const row=document.getElementById('statsRow'); const selected=STATIONS.filter(s=>state.selected.has(s)); if(!selected.length || !STATIONS.length){ row.innerHTML='<div class="stat"><div class="label">Select stations</div></div>'; return; }
  function avg(k){ const vals=selected.map(s=>{ const a=dataCache[state.period]?.[k]?.[s]; return a?a[a.length-1]:0; }); return vals.reduce((a,b)=>a+b,0)/vals.length; }
  function sum(k){ return selected.map(s=>{ const a=dataCache[state.period]?.[k]?.[s]; return a?a[a.length-1]:0; }).reduce((a,b)=>a+b,0); }
  const tiles=[{label:'Voltage',v:avg('voltage').toFixed(0),u:'V'},{label:'Current',v:avg('current').toFixed(1),u:'A'},{label:'Power',v:sum('power').toFixed(1),u:'kW'},{label:'Discharge',v:sum('discharge').toFixed(1),u:'L/s'},{label:'Pressure',v:avg('pressure').toFixed(0),u:'psi'},{label:'Static WL',v:avg('levelStatic').toFixed(1),u:'m'},{label:'Pumping WL',v:avg('levelPumping').toFixed(1),u:'m'}];
  row.innerHTML=tiles.map(t=>`<div class="stat" onclick="selectMetric('${t.label.toLowerCase().replace(' ','')}')" style="cursor:pointer;"><div class="label">${t.label}</div><div class="value">${t.v}<span>${t.u}</span></div></div>`).join(''); }

  // ----- metric tabs -----
  function renderMetricTabs(){ const wrap=document.getElementById('metricTabs'); wrap.innerHTML=METRICS.map(m=>`<button class="metric-tab ${state.metrics.has(m.key)?'active':''}" onclick="toggleMetric('${m.key}')">${m.label}<span class="unit">${m.unit}</span></button>`).join(''); }
  function toggleMetric(k){ if(state.metrics.has(k)){ if(state.metrics.size===1)return; state.metrics.delete(k); } else state.metrics.add(k); commitMetric(); }
  function selectMetric(k){ state.metrics=new Set([k]); commitMetric(); }
  function commitMetric(){ state.metric=[...state.metrics][0]||'voltage'; renderMetricTabs(); if(state.view==='trend') buildChart(); else if(state.view==='compare') renderCompare(); else renderHeatmap(); }

  // ----- chart -----
  function buildChart(){ const canvas=document.getElementById('mainChart'); const labels=buildLabels(state.period); const selected=STATIONS.filter(s=>state.selected.has(s)); if(!selected.length || !STATIONS.length){ if(mainChartInstance){ mainChartInstance.destroy(); mainChartInstance=null; } return; }
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const tickColor=isDark?'#a9b8e8':'#6d7fb5'; const gridColor=isDark?'#233152':'#dfe8fa';
  const keys=[...state.metrics]; const datasets=keys.map(k=>{ const m=METRICS.find(x=>x.key===k); const color=themeColor(m.color); const avg=labels.map((_,i)=>{ const vals=selected.map(s=>{ const a=dataCache[state.period]?.[k]?.[s]; return a?a[i]||0:0; }); return vals.reduce((a,b)=>a+b,0)/vals.length; }); return { label:`${m.label} (${m.unit})`, data:avg, borderColor:color, backgroundColor:color, borderWidth:2.5, tension:.35, pointRadius:3, fill:false }; });
  if(keys.some(k=>k==='levelStatic'||k==='levelPumping')){ selected.forEach(s=>{ if(PUMP_SETTING[s]!==undefined){ datasets.push({ label:s+' Pump Setting', data:labels.map(()=>PUMP_SETTING[s]), borderColor:stationColor(s), borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false }); } }); }
  if(mainChartInstance) mainChartInstance.destroy();
  mainChartInstance=new Chart(canvas,{ type:'line', data:{labels,datasets}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top', labels:{ color:tickColor, font:{size:10} } } }, scales:{ x:{ ticks:{color:tickColor,font:{size:10}}, grid:{color:gridColor} }, y:{ ticks:{color:tickColor,font:{size:10}}, grid:{color:gridColor} } } } }); }

  // ----- compare & heatmap -----
  function renderCompare(){ const box=document.getElementById('compareView'); const selected=STATIONS.filter(s=>state.selected.has(s)); if(!selected.length || !STATIONS.length){ box.innerHTML='<div class="empty-note">Select stations</div>'; return; }
  box.innerHTML=[...state.metrics].map(k=>{ const m=METRICS.find(x=>x.key===k); const sorted=selected.map(s=>{ const a=dataCache[state.period]?.[k]?.[s]; return {station:s,value:a?a[a.length-1]:0}; }).sort((a,b)=>b.value-a.value); const max=Math.max(...sorted.map(r=>r.value),1); return `<div style="margin-bottom:8px;"><span style="font-family:var(--mono);font-size:9px;color:${themeColor(m.color)};">${m.label}</span>${sorted.map(r=>`<div class="rank-row"><span class="rname">${escapeHtml(r.station)}</span><div class="rbar-wrap"><div class="rbar" style="width:${(r.value/max*100)}%;background:${themeColor(m.color)};"></div></div><span class="rval">${r.value.toFixed(1)}</span></div>`).join('')}</div>`; }).join(''); }
  function renderHeatmap(){ const box=document.getElementById('heatmapView'); const selected=STATIONS.filter(s=>state.selected.has(s)); if(!selected.length || !STATIONS.length){ box.innerHTML='<div class="empty-note">Select stations</div>'; return; }
  let html='<table><thead><tr><th>Station</th>'+METRICS.map(m=>`<th>${m.label}</th>`).join('')+'</tr></thead><tbody>';
  selected.forEach(s=>{ html+='<tr><td>'+escapeHtml(s)+'</td>'; METRICS.forEach(m=>{ const a=dataCache[state.period]?.[m.key]?.[s]; const v=a?a[a.length-1]:0; const t=THRESHOLDS[m.key]; let bg='rgba(35,192,139,0.3)'; if(v<t.criticalMin||v>t.criticalMax) bg='rgba(239,77,106,0.5)'; else if(v<t.min||v>t.max) bg='rgba(240,166,60,0.4)'; html+=`<td style="background:${bg};">${v.toFixed(1)}</td>`; }); html+='</tr>'; }); html+='</tbody></table>'; box.innerHTML=html; }

  // ----- view toggle -----
  function setView(v){ state.view=v; document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); document.getElementById('trendChartWrap').style.display=v==='trend'?'':'none'; document.getElementById('compareView').style.display=v==='compare'?'':'none'; document.getElementById('heatmapView').style.display=v==='heatmap'?'':'none'; if(v==='trend') buildChart(); else if(v==='compare') renderCompare(); else renderHeatmap(); }
  document.getElementById('viewToggle').addEventListener('click',e=>{ const btn=e.target.closest('button[data-view]'); if(btn) setView(btn.dataset.view); });

  // ----- period -----
  document.getElementById('periodTabs').addEventListener('click',e=>{ const btn=e.target.closest('button[data-period]'); if(!btn)return; document.querySelectorAll('#periodTabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); state.period=btn.dataset.period; renderAll(); });

  // ----- theme -----
  function toggleTheme(){ const d=document.documentElement; const dark=d.getAttribute('data-theme')==='dark'; if(dark)d.removeAttribute('data-theme'); else d.setAttribute('data-theme','dark'); try{localStorage.setItem('agus-theme',dark?'light':'dark');}catch(e){} renderAll(); }

  // ----- export / print -----
  document.getElementById('exportCsvBtn').addEventListener('click',()=>{ if(!STATIONS.length)return; const keys=[...state.metrics]; const labels=buildLabels(state.period); const selected=STATIONS.filter(s=>state.selected.has(s)); if(!selected.length)return; let csv=''; keys.forEach(k=>{ const m=METRICS.find(x=>x.key===k); csv+=`${m.label} (${m.unit})\n`; csv+='Period,'+selected.map(s=>`"${s}"`).join(',')+'\n'; labels.forEach((l,i)=>{ csv+=l+','+selected.map(s=>{ const a=dataCache[state.period]?.[k]?.[s]; return a?a[i]?.toFixed(2)||0:0; }).join(',')+'\n'; }); csv+='\n'; }); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='analytics.csv'; a.click(); });
  document.getElementById('printBtn').addEventListener('click',()=>window.print());

  // ----- GAS live data loader (NO HARDCODED FALLBACK) -----
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzeEeGTvZmJUOHpHLS0Zijgd7X1-JvdTTIymVwGW6R616dIjDlssJCVFx-gTJgfRr7P5A/exec';

  function gasNum(v){ if(v===null||v===undefined||v==='')return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
  function gasReading(entry, metricKey){
    if(metricKey==='voltage'||metricKey==='current'){ const key=metricKey==='voltage'?'voltage':'current'; const phases=key==='voltage'?['L1L2','L1L3','L2L3']:['L1','L2','L3']; let vals=phases.map(ph=>gasNum(entry[key+'Before'+ph])); if(!vals.some(v=>v!==null)) vals=phases.map(ph=>gasNum(entry[key+'After'+ph])); vals=vals.filter(v=>v!==null); if(!vals.length)return null; return vals.reduce((a,b)=>a+b,0)/vals.length; }
    if(metricKey==='power'){ const v=gasReading(entry,'voltage'); const i=gasReading(entry,'current'); if(v===null||i===null)return null; return Math.sqrt(3)*v*i*0.85/1000; }
    const field={discharge:'dischargeLps',pressure:'pressurePsi',levelStatic:'staticWl',levelPumping:'pumpingWl'}[metricKey];
    return gasNum(entry[field]);
  }
  function gasBucketEnds(period){ const now=new Date(); const n=BUCKET_COUNT[period]; const ends=[]; for(let i=n-1;i>=0;i--){ const d=new Date(now); if(period==='weekly'){ d.setDate(d.getDate()-i*7); } else if(period==='monthly'){ d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-i); d.setMonth(d.getMonth()+1,0); d.setHours(23,59,59,999); } else { d.setHours(0,0,0,0); d.setFullYear(d.getFullYear()-i); d.setMonth(11,31); d.setHours(23,59,59,999); } ends.push(d.getTime()); } return ends; }
  function parseGasDate(raw){ if(!raw)return null; const d=new Date(raw); if(!isNaN(d.getTime()))return d.getTime(); const m=String(raw).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]).getTime(); return null; }
  function buildLiveSeries(entries, metricKey, period){ const ends=gasBucketEnds(period); const n=ends.length; const series=new Array(n).fill(null); const pts=[]; (entries||[]).forEach(en=>{ const t=parseGasDate(en.date); const v=gasReading(en,metricKey); if(t!==null&&v!==null)pts.push({t,v}); }); if(!pts.length)return series; pts.sort((a,b)=>a.t-b.t); let lastVal=null; pts.forEach(pt=>{ let bi=0; for(let i=0;i<n;i++){ if(pt.t<=ends[i]){ bi=i; break; } } lastVal=pt.v; series[bi]=pt.v; }); let carry=null; for(let i=0;i<n;i++){ if(series[i]!==null)carry=series[i]; else if(carry!==null)series[i]=carry; } return series; }
  function pumpSettingFromSpecs(specs, fallback){ let val=null; (specs||[]).forEach(s=>{ if(/SETTING|SET\b|SET DEPTH/i.test(String(s.label))){ const v=gasNum(String(s.value)); if(v!==null&&v>0)val=v; } }); return val!==null?val:(fallback||50); }
  function wellDepthFromSpecs(specs, fallback){ let val=null; (specs||[]).forEach(s=>{ const isSection=/WELL|BORE|BOREHOLE/i.test(String(s.section)); const isLabel=/WELL DEPTH|BOREHOLE DEPTH|TOTAL DEPTH|WELL DEPTH M/i.test(String(s.label)); if(isSection&&isLabel){ const v=gasNum(String(s.value)); if(v!==null&&v>0)val=v; } }); return val!==null?val:(fallback||60); }

  async function loadLiveData(){
    const statusEl=document.getElementById('gasStatus');
    try {
      statusEl.textContent='connecting…';
      const listResp=await fetch(GAS_API_URL+'?action=assets');
      const list=await listResp.json();
      if(!list.ok)throw new Error(list.error||'GAS error');
      const assets=(list.assets||[]).filter(a=>a.category==='Pumping Stations');
      if(!assets.length)throw new Error('No pumping stations found');
      statusEl.textContent='loading '+assets.length+' stations…';
      const details=await Promise.all(assets.map(a=>fetch(GAS_API_URL+'?action=asset&id='+encodeURIComponent(a.id)).then(r=>r.json()).then(j=>({info:a,asset:j.asset}))));

      const newStations=[];
      const newPump={};
      const newDepth={};
      const live={weekly:{},monthly:{},yearly:{}};
      METRICS.forEach(m=>{ live.weekly[m.key]={}; live.monthly[m.key]={}; live.yearly[m.key]={}; });

      details.forEach(d=>{ const asset=d.asset; if(!asset)return; const name=String(asset.title||d.info.title||d.info.id||'').trim(); if(!name)return; newStations.push(name); newPump[name]=pumpSettingFromSpecs(asset.specs,50); newDepth[name]=wellDepthFromSpecs(asset.specs,60); const log=Array.isArray(asset.log)?asset.log:[]; METRICS.forEach(m=>{ ['weekly','monthly','yearly'].forEach(p=>{ live[p][m.key][name]=buildLiveSeries(log,m.key,p); }); }); });

      if(!newStations.length)throw new Error('No readable station data');
      // fill missing with zeros
      newStations.forEach(name=>{ METRICS.forEach(m=>{ ['weekly','monthly','yearly'].forEach(p=>{ const arr=live[p][m.key][name]; if(!arr||arr.every(v=>v===null)){ live[p][m.key][name]=new Array(BUCKET_COUNT[p]).fill(0); } }); }); });

      STATIONS=newStations;
      PUMP_SETTING=newPump;
      WELL_DEPTH=newDepth;
      Object.keys(live).forEach(p=>{ dataCache[p]=live[p]; });
      state.selected=new Set(STATIONS);
      statusEl.textContent=STATIONS.length+' stations · live';
      renderAll();
    } catch(err){
      statusEl.textContent='error: '+err.message;
      // keep any existing data, just show error
    }
  }

  // ----- render all -----
  function renderAll(){ renderStationChips(); renderStats(); renderMetricTabs(); if(state.view==='trend') buildChart(); else if(state.view==='compare') renderCompare(); else renderHeatmap(); }

  // ----- keyboard shortcuts -----
  document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; if(e.key==='?'){ alert('1-7: toggle metrics\nT: trend\nC: compare\nH: heatmap\nS: theme\n/ : search'); } if(e.key>='1'&&e.key<='7'){ const idx=parseInt(e.key)-1; if(idx<METRICS.length) toggleMetric(METRICS[idx].key); } if(e.key==='t'||e.key==='T') setView('trend'); if(e.key==='c'||e.key==='C') setView('compare'); if(e.key==='h'||e.key==='H') setView('heatmap'); if(e.key==='s'||e.key==='S') toggleTheme(); if(e.key==='/'){ e.preventDefault(); document.getElementById('stationSearch').focus(); } if(e.key==='Escape') closeStationModal(); });

  // ----- start: load from GAS, no hardcoded data -----
  loadLiveData();
</script>
</body>
</html>
